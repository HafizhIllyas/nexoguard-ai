[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexoguard"
version = "1.0.0"
description = "Automated Clinical Decision Support & Intrapartum CTG Predictive Modeling Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "joblib>=1.2.0",
    "streamlit>=1.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "shap>=0.42.0",
    "ruff>=0.1.0"
]

[project.scripts]
nexoguard = "nexoguard.cli:main"
nexoguard-test = "test_pipeline:main"
nexoguard-api = "nexoguard.api.app:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexoguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"
